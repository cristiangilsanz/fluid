name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install clang-format==19.1.5
      - run: clang-format --dry-run --Werror src/*.cpp src/fluid/*.cpp src/fluid/*.hpp tests/*.cpp

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFLUID_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build --build-config Release --output-on-failure
